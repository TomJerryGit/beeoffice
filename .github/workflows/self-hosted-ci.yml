name: self-hosted-ci

on:
  push:
    branches: [wps-run-ui-2026-10-22]
  workflow_dispatch:

jobs:
  gates-and-tests:
    name: 46 门禁 + 全量测试
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 诊断 Python / 依赖（输出写入工作区，失败不阻断本步）
        shell: powershell
        continue-on-error: true
        run: |
          $py = 'D:\Program Files\Python311\python.exe'
          $log = Join-Path (Get-Location) '_ci_diag.txt'
          "py=$py exists=$(Test-Path $py)" | Out-File -LiteralPath $log -Encoding utf8
          $code = @'
import sys
print(sys.executable)
print(sys.version)
for name in ["PySide6", "pandas", "openpyxl", "fitz"]:
    try:
        __import__(name)
        print(name, "ok")
    except Exception as e:
        print(name, "FAIL", type(e).__name__, e)
'@
          Set-Content -LiteralPath (Join-Path (Get-Location) '_ci_check_deps.py') -Value $code -Encoding utf8
          & $py (Join-Path (Get-Location) '_ci_check_deps.py') *>> $log
          Get-Content -LiteralPath $log

      - name: 准备测试语料（本机缓存优先）
        shell: powershell
        run: |
          $src = 'D:\beeofficeV\tests\fidelity\corpus'
          $dst = 'tests\fidelity\corpus'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          if (Test-Path $src) {
            Copy-Item "$src\*" $dst -Recurse -Force
            "copied corpus from $src"
          } else {
            "WARNING: local corpus cache not found; corpus-dependent tests may skip/fail"
          }

      - name: 46 项回归门禁
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: 'C:\Windows\Fonts'
          PYTHONIOENCODING: utf-8
        run: |
          $py = 'D:\Program Files\Python311\python.exe'
          $env:PYTHONPATH = (Get-Location).Path
          & $py tools\check_gates.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 全量测试（fidelity + unit）
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: 'C:\Windows\Fonts'
          PYTHONIOENCODING: utf-8
          BEEOFFICE_DRAFT_DIR: 'D:\beeoffice_ci_drafts'
        run: |
          $py = 'D:\Program Files\Python311\python.exe'
          $env:PYTHONPATH = (Get-Location).Path
          & $py -m pytest tests/fidelity tests/unit -q --no-header -p no:cacheprovider -o log_file= --timeout=900
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 构建发行包（仅手动/标签触发）
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $buildTmp = Join-Path (Get-Location) '_build_tmp'
          New-Item -ItemType Directory -Force -Path $buildTmp | Out-Null
          $env:TEMP = $buildTmp
          $env:TMP = $buildTmp
          $py = 'D:\Program Files\Python311\python.exe'
          $env:PYTHONPATH = (Get-Location).Path
          & $py beeoffice\build_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Filter 'BeeOffice-v*-windows.zip*' | Select-Object Name,Length

      - name: 上传构建产物（仅手动/标签触发）
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: BeeOffice-windows-${{ github.run_number }}
          path: |
            BeeOffice-v*-windows.zip
            BeeOffice-v*-windows.zip.sha256
          if-no-files-found: error
          retention-days: 14
