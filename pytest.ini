[pytest]
# 指定 Qt 绑定库
qt_api = pyside6

# 测试文件搜索路径
testpaths = tests

# 默认命令行参数
#
# v5.0.5 调整：
#   原实现把 --cov=beeoffice / --cov-fail-under=25 放在 addopts 里，
#   导致单文件测试必然因覆盖率不足而失败（例如：
#       ERROR: Coverage failure: total of 13 is less than fail-under=25
#   ）
#   现全部移出 addopts。
#
#   单文件调试（默认无覆盖率，秒级返回）：
#       pytest tests/test_xxx.py -v
#
#   全量测试 + 覆盖率（用 run_tests.bat，或手动执行）：
#       pytest tests/ ^
#           --cov=beeoffice ^
#           --cov-report=term-missing:skip-covered ^
#           --cov-report=xml ^
#           --cov-fail-under=25
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
#   --maxfail=5

# 测试文件命名规则
python_files = test_*.py

# 测试类命名规则
python_classes = Test*

# 测试函数命名规则
python_functions = test_*

# 自定义标记
markers =
    slow: 标记为慢速测试，可通过 -m "not slow" 跳过
    ui: 标记为 UI 测试，需要图形环境
    integration: 标记为集成测试
    unit: 标记为单元测试
    docx: DOCX 导出相关测试
    pdf: PDF 导出相关测试
    md: Markdown 转换相关测试

# 日志配置
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = tests/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 忽略的目录
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    .venv
    venv
    backup
    node_modules
    tests/helpers

# 最短显示字符数
minversion = 7.0

# 测试运行超时（秒）
# 需要 pytest-timeout 插件
timeout = 60