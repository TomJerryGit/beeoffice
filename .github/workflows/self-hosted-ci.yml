# BeeOffice 自托管 runner CI（2026-10-23）
#
# 这台 runner 以 LocalSystem 服务运行，工作区没有业务语料/依赖缓存；
# 因此本工作流直接在**本机已有仓库 D:\beeofficeV** 上跑，而不是 checkout 到
# runner 工作区（那里缺 tests/fidelity/corpus 大文件，且服务账号环境不同）。
# 推送触发后由 beeoffice-local-runner 执行：
#   - 46 项回归门禁
#   - 全量 fidelity + unit 测试
#   - 构建 Windows 发行包并上传 artifact（zip + sha256）
name: self-hosted-ci

on:
  push:
    branches: [wps-run-ui-2026-10-22]
  workflow_dispatch:

jobs:
  gates-tests-build:
    name: 46 门禁 + 全量测试 + 构建
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 120

    steps:
      - name: 环境检查（写诊断到 D:\beeoffice_ci_diag.txt，不阻断）
        shell: powershell
        continue-on-error: true
        run: |
          $diag = 'D:\beeoffice_ci_diag.txt'
          $repo = 'D:\beeofficeV'
          $py = 'D:\Program Files\Python311\python.exe'
          "== env $(Get-Date -Format o) ==" | Out-File -LiteralPath $diag -Encoding utf8
          "user=$env:USERNAME workspace=$env:GITHUB_WORKSPACE" | Out-File -LiteralPath $diag -Append -Encoding utf8
          "repo=$repo exists=$(Test-Path $repo)" | Out-File -LiteralPath $diag -Append -Encoding utf8
          "py=$py exists=$(Test-Path $py)" | Out-File -LiteralPath $diag -Append -Encoding utf8
          try {
            & $py --version *>> $diag
            "py_exit=$LASTEXITCODE" | Out-File -LiteralPath $diag -Append -Encoding utf8
            & $py -c "import sys; print(sys.executable); import PySide6, pandas, openpyxl, fitz; print('deps_ok')" *>> $diag
            "deps_exit=$LASTEXITCODE" | Out-File -LiteralPath $diag -Append -Encoding utf8
          } catch {
            "EXCEPTION: $_" | Out-File -LiteralPath $diag -Append -Encoding utf8
          }
          Get-Content -LiteralPath $diag

      - name: 46 项回归门禁
        shell: powershell
        run: |
          Set-Location 'D:\beeofficeV'
          $py = 'D:\Program Files\Python311\python.exe'
          $env:PYTHONPATH = (Get-Location).Path
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QPA_FONTDIR = 'C:\Windows\Fonts'
          $env:PYTHONIOENCODING = 'utf-8'
          & $py tools\check_gates.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 全量测试（fidelity + unit）
        shell: powershell
        run: |
          Set-Location 'D:\beeofficeV'
          $py = 'D:\Program Files\Python311\python.exe'
          $env:PYTHONPATH = (Get-Location).Path
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QPA_FONTDIR = 'C:\Windows\Fonts'
          $env:PYTHONIOENCODING = 'utf-8'
          $env:BEEOFFICE_DRAFT_DIR = 'D:\beeoffice_ci_drafts'
          & $py -m pytest tests/fidelity tests/unit -q --no-header -p no:cacheprovider -o log_file= --timeout=900
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 构建发行包并复制到 artifact 目录
        shell: powershell
        run: |
          Set-Location 'D:\beeofficeV'
          $py = 'D:\Program Files\Python311\python.exe'
          $env:PYTHONPATH = (Get-Location).Path
          $env:PYTHONIOENCODING = 'utf-8'
          $buildTmp = 'D:\beeofficeV\_ptmp\ci_build'
          New-Item -ItemType Directory -Force -Path $buildTmp | Out-Null
          $env:TEMP = $buildTmp
          $env:TMP = $buildTmp
          & $py beeoffice\build_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'artifact') | Out-Null
          Copy-Item 'D:\beeofficeV\BeeOffice-v*-windows.zip*' (Join-Path $env:GITHUB_WORKSPACE 'artifact') -Force
          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'artifact') | Select-Object Name,Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: BeeOffice-windows-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
