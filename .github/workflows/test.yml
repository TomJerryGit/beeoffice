name: tests

# M1A 发布门禁：
#   fast  = 语法 / 公式语义 / 最小单测 / 安全扫描
#   full  = 全量测试 + 覆盖率 + 核心 100% + 安全扫描
# full 不再 continue-on-error；失败即阻塞。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  QT_QPA_PLATFORM: "offscreen"
  QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: 快速回归（语法/公式/安全）
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装最小依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas python-docx beautifulsoup4 markdown lxml pillow pytest

      - name: 语法编译检查
        run: python tools/check_syntax.py

      - name: 安全扫描（AST，高危 >0 失败）
        run: python tools/security_scan.py

      - name: 公式引擎 Excel 语义冒烟
        run: python tools/smoke_formula.py

      - name: 纯逻辑单测
        run: >
          python -m pytest
          tests/unit/test_formula_excel_semantics.py
          tests/unit/test_docx_image_export.py
          tests/unit/test_nl_formula.py
          tests/unit/test_settings.py
          tests/unit/test_security_scan.py
          -q

  full:
    name: 全量测试（含 GUI，阻塞）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装全部依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 全量 pytest + 覆盖率
        run: >
          python -m pytest tests
          -q --timeout=120
          --cov=beeoffice
          --cov-report=json:coverage.json
          --cov-report=term

      - name: 安全扫描（AST）
        run: python tools/security_scan.py

      - name: 核心模块 100% 覆盖率门槛
        run: python tools/coverage_gate.py coverage.json

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: ignore
          retention-days: 7
