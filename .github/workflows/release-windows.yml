name: windows-release

# 手动触发的 Windows 发布流水线：
#  构建 → 安装器 → 发布检查（安全/哈希/说明）→ 可选签名 → attestation → artifact
# 未配置证书时产物是 Beta/Unsigned；不得称为稳定签名版。
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_CERT_PFX_BASE64: "${{ secrets.WINDOWS_CERT_PFX_BASE64 }}"
      WINDOWS_CERT_PASSWORD: "${{ secrets.WINDOWS_CERT_PASSWORD }}"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 快速回归
        run: |
          python tools/check_syntax.py
          python -m pytest tests/unit/test_formula_excel_semantics.py tests/unit/test_settings.py -q

      - name: 构建发布包
        run: python beeoffice/build_release.py

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 构建安装器
        run: python tools/build_installer.py --skip-build

      - name: 发布检查（安全/哈希/ZIP/说明）
        run: python tools/release_check.py --skip-coverage

      - name: 代码签名（配置证书时）
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        run: |
          $cert = Join-Path $env:RUNNER_TEMP "beeoffice-sign.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $env:BEEOFFICE_SIGN_PFX = $cert
          $env:BEEOFFICE_SIGN_PASSWORD = $env:WINDOWS_CERT_PASSWORD
          $zip = Get-ChildItem BeeOffice-v*-windows.zip | Select-Object -First 1
          $setup = Get-ChildItem release-archive/BeeOffice-Setup-v*.exe | Select-Object -First 1
          python tools/sign_windows.py $zip.FullName $setup.FullName

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            BeeOffice-v*-windows.zip
            release-archive/BeeOffice-Setup-v*.exe

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: BeeOffice-windows
          path: |
            BeeOffice-v*-windows.zip
            BeeOffice-v*-windows.zip.sha256
            release-archive/BeeOffice-Setup-v*.exe
            release-archive/BeeOffice-Setup-v*.exe.sha256
          if-no-files-found: error
