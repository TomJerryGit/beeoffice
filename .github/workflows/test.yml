name: tests

# M1A 发布门禁：
#   fast  = 语法 / 公式语义 / 最小单测 / 安全扫描
#   full  = 全量测试 + 覆盖率 + 核心 100% + 安全扫描
# full 不再 continue-on-error；失败即阻塞。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  QT_QPA_PLATFORM: "offscreen"
  QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --single-process --disable-dev-shm-usage"
  GIT_SSH_COMMAND: 'ssh -i D:/actions-runner-beeoffice/ci_deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o ConnectTimeout=20' 

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: cmd

jobs:
  fast:
    name: 快速回归（语法/公式/安全）
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: 自托管 Runner 配置 SSH
        if: runner.environment != 'github-hosted'
        shell: cmd
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - uses: actions/checkout@v4

      - name: 使用自托管 Python
        if: runner.environment != 'github-hosted'
        shell: cmd
        run: |
          python --version
          python -c "import pandas, PySide6, openpyxl, docx, pptx; print('deps_ok')"

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装最小依赖
        if: runner.environment == 'github-hosted'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas python-docx beautifulsoup4 markdown lxml pillow pytest

      - name: 语法编译检查
        run: python tools/check_syntax.py

      - name: 安全扫描（AST，高危 >0 失败）
        run: python tools/security_scan.py

      - name: 公式引擎 Excel 语义冒烟
        run: python tools/smoke_formula.py

      - name: 纯逻辑单测
        run: >
          python -m pytest
          tests/unit/test_formula_excel_semantics.py
          tests/unit/test_docx_image_export.py
          tests/unit/test_nl_formula.py
          tests/unit/test_settings.py
          tests/unit/test_security_scan.py
          -q

  full:
    name: 全量测试（含 GUI，阻塞）
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: 自托管 Runner 配置 SSH
        if: runner.environment != 'github-hosted'
        shell: cmd
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - uses: actions/checkout@v4

      - name: 使用自托管 Python
        if: runner.environment != 'github-hosted'
        shell: cmd
        run: |
          python --version
          python -c "import pandas, PySide6, openpyxl, docx, pptx; print('deps_ok')"

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装全部依赖
        if: runner.environment == 'github-hosted'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock

      - name: 全量 pytest + 覆盖率
        run: >
          python -m pytest tests
          -q --timeout=120
          --cov=beeoffice
          --cov-report=json:coverage.json
          --cov-report=term

      - name: 安全扫描（AST）
        run: python tools/security_scan.py

      - name: 核心模块 100% 覆盖率门槛
        run: python tools/coverage_gate.py coverage.json

      - name: 上传覆盖率报告
        if: always() && runner.environment == 'github-hosted'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: ignore
          retention-days: 7
